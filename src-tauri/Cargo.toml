[package]
name = "safedisk-cleaner"
version = "0.2.6"
description = "Safe Windows disk analyzer and cleaner"
authors = ["ajjs1ajjs"]
edition = "2021"

[lib]
name = "safedisk_cleaner_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["custom-protocol"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
rayon = "1"
walkdir = "2"
blake3 = "1"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
zip = { version = "2", optional = true }
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Registry",
  "Win32_System_Ioctl"
] }

[features]
custom-protocol = ["tauri/custom-protocol"]
embed-webview2 = ["dep:zip"]

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = true
strip = true
