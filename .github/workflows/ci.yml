name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore SafeDiskCleaner.slnx

      - name: Build
        run: dotnet build SafeDiskCleaner.slnx -c Release --no-restore

      - name: Test
        run: dotnet test SafeDiskCleaner.slnx -c Release --no-build --collect:"XPlat Code Coverage"

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: '**/TestResults/**/*.cobertura.xml'
          if-no-files-found: ignore

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish portable
        run: |
          dotnet publish src/SafeDiskCleaner.App -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o BUILD/ci/portable

      - name: Stage artifacts
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $final = "BUILD/ci/final"
          New-Item -ItemType Directory -Path $final -Force | Out-Null
          Copy-Item BUILD/ci/portable/SafeDiskCleaner.exe "$final/SafeDiskCleaner-$version-portable-win64.exe" -Force
          Copy-Item scripts/run.cmd "$final/run.cmd" -Force
          Get-ChildItem $final -File | ForEach-Object { Unblock-File -Path $_.FullName -ErrorAction SilentlyContinue }
          Compress-Archive -Path "$final/*" -DestinationPath "BUILD/ci/SafeDiskCleaner-$version-portable-win64.zip" -Force
          "version=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            BUILD/ci/SafeDiskCleaner-${{ env.version }}-portable-win64.zip
            BUILD/ci/final/SafeDiskCleaner-${{ env.version }}-portable-win64.exe
            BUILD/ci/final/run.cmd
