name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # For a .NET desktop app, GitHub Pages is not applicable.
      # This workflow is kept as a placeholder for documentation hosting.
      # To enable, create a 'docs' folder with static content and update the path below.
      - name: Setup Pages
        if: false  # Disabled - no web content to deploy
        uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        if: false  # Disabled - no web content to deploy
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        if: false  # Disabled - no web content to deploy
        id: deployment
        uses: actions/deploy-pages@v4
